spring:
  application:
    name: order-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/orderservice}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: ${EUREKA_PREFER_IP_ADDRESS:true}
    health-check-url-path: /actuator/health

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:user-service}
    audience: ${JWT_AUDIENCE:buy-01-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  product:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
