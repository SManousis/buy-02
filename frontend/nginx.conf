server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.csr.html;

    # Angular client-side routing
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Keep the browser on one origin and send every API request through the
    # secured Spring Cloud Gateway. The trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 3M;
    }

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
