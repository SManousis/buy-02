<h3 class="list-heading">{{ heading }}</h3>
<ol class="stat-list">
  <li class="stat-row" *ngFor="let product of products; trackBy: trackByProductId">
    <a class="stat-name" [routerLink]="['/products', product.productId]">{{ product.name }}</a>
    <span class="stat-primary" *ngIf="measure === 'amount'; else quantityFirst">
      {{ product.amount | currency:'EUR' }}
      <small>{{ product.quantity }} {{ quantityLabel }}</small>
    </span>
    <ng-template #quantityFirst>
      <span class="stat-primary">
        {{ product.quantity }} {{ quantityLabel }}
        <small>{{ product.amount | currency:'EUR' }}</small>
      </span>
    </ng-template>
  </li>
</ol>
