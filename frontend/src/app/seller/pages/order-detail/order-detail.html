<div class="container page-wrapper seller-order-detail-page">
  <a routerLink="/seller/orders" class="back-link">
    <mat-icon>arrow_back</mat-icon> Back to orders
  </a>

  <div *ngIf="loading" class="state-center" aria-live="polite">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <div *ngIf="!loading && notFound" class="empty-dash">
    <mat-icon>search_off</mat-icon>
    <h2>Order not found</h2>
    <p>This order does not exist or was not placed for one of your products.</p>
    <a routerLink="/seller/orders" class="btn-primary">Back to orders</a>
  </div>

  <ng-container *ngIf="!loading && !notFound && order as o">
    <div class="detail-header">
      <div>
        <h1 class="dash-title">Order #{{ o.id.slice(-8) }}</h1>
        <p class="dash-sub">Placed {{ o.createdAt | date:'medium' }} &middot; Buyer {{ o.buyerId.slice(-8) }}</p>
      </div>
      <span class="status-badge" [ngClass]="statusClass(o.status)">{{ o.status }}</span>
    </div>

    <app-order-detail-body [order]="o">
      <div class="detail-actions" *ngIf="nextStatus as next">
        <button type="button" class="btn-primary" [disabled]="updating" (click)="advance()">
          {{ updating ? 'Updating…' : ('Mark as ' + next) }}
        </button>
      </div>
    </app-order-detail-body>
  </ng-container>
</div>
