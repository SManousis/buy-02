sonar.projectKey=buy-01-frontend
sonar.projectName=buy-01-frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**
# Bootstrap entry points: Express/SSR wiring and browser bootstrap, not unit-testable logic.
sonar.coverage.exclusions=src/main.ts,src/main.server.ts,src/server.ts
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
# Analysis-only config; the scanner's bundled TypeScript predates "module": "preserve".
sonar.typescript.tsconfigPath=tsconfig.sonar.json
