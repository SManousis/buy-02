services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (no ZooKeeper needed)
  # Single-node Kafka in KRaft mode
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-buy-01-api}
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_DEFAULT_ZONE=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # ── Microservices ──────────────────────────────────────────────────────────

  user-service:
    build: ./user-service
    environment:
      - MONGODB_URI=mongodb://mongo:27017/userservice
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-buy-01-api}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - MEDIA_SERVICE_NAME=media-service
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_DEFAULT_ZONE=http://discovery-service:8761/eureka/
    depends_on:
      mongo:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  product-service:
    build: ./product-service
    environment:
      - MONGODB_URI=mongodb://mongo:27017/productservice
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-buy-01-api}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_DEFAULT_ZONE=http://discovery-service:8761/eureka/
      - MEDIA_SERVICE_BASE_URL=http://media-service:8083
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s

  media-service:
    build: ./media-service
    environment:
      - SERVER_PORT=8083
      - MONGODB_URI=mongodb://mongo:27017/mediaservice
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_ISSUER=${JWT_ISSUER:-user-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-buy-01-api}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - MEDIA_STORAGE_PATH=/app/media-storage
      - MEDIA_PUBLIC_BASE_URL=/api/media/images
      - EUREKA_CLIENT_ENABLED=true
      - EUREKA_DEFAULT_ZONE=http://discovery-service:8761/eureka/
    volumes:
      - media-storage:/app/media-storage
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    # Probe 127.0.0.1, not localhost: both Nginx configs use `listen 80;`
    # (IPv4 only) while the container resolves localhost to ::1 first.
    # Assert only that Nginx answered with a status line, and accept the 301
    # as well as the 200: the production overlay's port-80 server block
    # redirects to HTTPS, and following that redirect is not this probe's job.
    # busybox wget and grep are the only tools used, so no extra package is
    # required in the image.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S --spider -O /dev/null http://127.0.0.1:80/index.csr.html 2>&1 | grep -qE 'HTTP/1.1 (200|301)'"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
  media-storage:
