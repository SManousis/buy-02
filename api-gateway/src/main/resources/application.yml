server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/auth/**,/me,/me/**
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/products,/products/**
            - id: media-service-route
              uri: lb://media-service
              predicates:
                - Path=/media/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: ${GATEWAY_MEDIA_MAX_REQUEST_SIZE:3MB}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: ${EUREKA_PREFER_IP_ADDRESS:true}
    health-check-url-path: /actuator/health

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:user-service}
    audience: ${JWT_AUDIENCE:buy-01-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  upload:
    max-request-size: ${GATEWAY_MEDIA_MAX_REQUEST_SIZE:3MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
