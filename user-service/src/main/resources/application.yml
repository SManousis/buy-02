spring:
  application:
    name: user-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/userservice}

  data:
    mongodb:
      auto-index-creation: true # creates @Indexed unique constraints on startup

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: never    # never leak internal exception messages to clients
    include-stacktrace: never

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: ${EUREKA_PREFER_IP_ADDRESS:true}
    health-check-url-path: /actuator/health

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 h
    issuer: ${JWT_ISSUER:user-service}
    audience: ${JWT_AUDIENCE:buy-01-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  media:
    service-name: ${MEDIA_SERVICE_NAME:media-service}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
